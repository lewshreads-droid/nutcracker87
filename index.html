<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutcracker '87</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#07040f">
<!--
  NUTCRACKER '87 — a one-move fighting game.
  Run it: open this file in any modern browser (Chrome, Firefox, Edge). No server, no assets.
  Controls are on the title screen. M = mute, H = hitboxes, P = pause, Esc = back to title.
-->
<style>
  /* Single dark arcade look by design: one screen, cabinet-black surround. */
  :root { --bg: #07040f; --fg: #e9e3d0; --muted: #8a7fa3; --focus: #ffd43b; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; box-sizing: border-box; overflow: hidden;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding-inline: 16px; padding-block: 12px;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
  }
  canvas { display: block; max-width: 100%; image-rendering: crisp-edges; image-rendering: pixelated; outline: none; cursor: pointer; }
  canvas:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .note { margin: 0; max-width: 72ch; text-align: center; color: var(--muted); letter-spacing: 0.04em; }
  .note b { color: var(--fg); font-weight: 600; }

  /* Touch layout: the game fills the screen; thumb controls float over its corners. */
  body.touch { padding: 0; gap: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  body.touch .note { display: none; }
  #pad, #rotate { display: none; }
  body.touch #pad { display: block; position: fixed; inset: 0; touch-action: none; }
  .ctl {
    position: absolute; display: grid; place-items: center; pointer-events: none;
    border: 2px solid rgba(233, 227, 208, 0.35); background: rgba(20, 12, 36, 0.35); color: rgba(233, 227, 208, 0.85);
    font: 700 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.08em;
  }
  .ctl.on { background: rgba(255, 212, 59, 0.35); border-color: rgba(255, 212, 59, 0.85); color: #fff; }
  .round { border-radius: 50%; }
  #dpad { width: 132px; height: 132px; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  #dpad span { position: absolute; font-size: 14px; opacity: 0.7; }
  #knob { position: absolute; left: 40px; top: 40px; width: 52px; height: 52px; border-radius: 50%; background: rgba(233, 227, 208, 0.3); }
  #kick { width: 92px; height: 92px; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); font-size: 14px; }
  #guard { width: 66px; height: 66px; right: calc(122px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .top { right: calc(8px + env(safe-area-inset-right, 0px)); width: 44px; height: 30px; border-radius: 8px; font-size: 13px; }
  #btnBack { top: calc(8px + env(safe-area-inset-top, 0px)); }
  #btnMute { top: calc(44px + env(safe-area-inset-top, 0px)); }
  #btnPause { top: calc(80px + env(safe-area-inset-top, 0px)); }
  #pad[data-scene="title"] #btnBack { display: none; }
  #pad:not([data-scene="fight"]) #btnPause { display: none; }
  @media (orientation: portrait) {
    body.touch #rotate {
      display: grid; place-items: center; position: fixed; inset: 0; z-index: 2; padding-inline: 24px;
      background: var(--bg); color: var(--fg); text-align: center; font: 600 16px/1.5 ui-monospace, Menlo, Consolas, monospace;
    }
  }
</style>
</head>
<body>
<canvas id="game" width="384" height="224" tabindex="0" aria-label="Nutcracker '87 game screen"></canvas>
<div id="pad" aria-hidden="true">

  <div id="kick" class="ctl round">KICK</div>
  <div id="btnBack" class="ctl top">✕</div>

<div id="rotate">Turn your phone sideways to play.</div>
<p class="note" id="note"><b>Needs a keyboard.</b> Click the game, then press Enter. P1: A/D move, W jump, S crouch, F kick, G guard. P2: arrows, K kick, L guard. M mutes.</p>

const TEXT_CACHE = new Map();

function textCanvas(str, color, outline, scale) {
  const key = str + '|' + color + '|' + outline + '|' + scale;
  let c = TEXT_CACHE.get(key);
  if (c) return c;
  const pad = outline ? 1 : 0;
  const wPx = Math.max(1, str.length * 6 - 1) + pad * 2, hPx = 7 + pad * 2;
  const [cv, x] = makeCanvas(wPx * scale, hPx * scale);
  const pix = [];
  for (let i = 0; i < str.length; i++) {
    const g = GLYPH_ROWS[str[i]];
    if (!g) continue;
    for (let r = 0; r < 7; r++) for (let col = 0; col < 5; col++)
      if (g[r][col] === '#') pix.push([i * 6 + col + pad, r + pad]);
  }
  if (outline) { x.fillStyle = outline; for (const [px, py] of pix) x.fillRect((px - 1) * scale, (py - 1) * scale, 3 * scale, 3 * scale); }
  x.fillStyle = color;
  for (const [px, py] of pix) x.fillRect(px * scale, py * scale, scale, scale);
  if (TEXT_CACHE.size > 500) TEXT_CACHE.clear();
  TEXT_CACHE.set(key, cv);
  return cv;
}
function textWidth(str, scale = 1, outline = true) { return (Math.max(1, String(str).length * 6 - 1) + (outline ? 2 : 0)) * scale; }
// o: { color, outline (null for none), scale, align: 'left'|'center'|'right' }
function drawText(ctx, str, x, y, o = {}) {
  str = String(str).toUpperCase();
  const scale = o.scale || 1;
  const c = textCanvas(str, o.color || '#fff', o.outline === undefined ? '#000' : o.outline, scale);
  let dx = x;
  if (o.align === 'center') dx = x - c.width / 2; else if (o.align === 'right') dx = x - c.width;
  ctx.drawImage(c, Math.round(dx), Math.round(y));
  return c.width;
}

const KEYS = {
  p1: { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', kick: 'KeyF', guard: 'KeyG' },
  p2: { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', kick: 'KeyK', guard: 'KeyL' },
};
const GAME_KEYS = new Set([...Object.values(KEYS.p1), ...Object.values(KEYS.p2), 'Space', 'Enter', 'Escape', 'KeyM', 'KeyH', 'KeyP']);
const OK_KEYS = ['Enter', 'Space', 'KeyF', 'KeyK'];

class Input {
  constructor() {
    this.down = new Set();
    this.pressed = new Set();   // edges since the last simulation step
    this.onAnyKey = null;
    window.addEventListener('keydown', e => {
      if (GAME_KEYS.has(e.code)) e.preventDefault();
      if (this.onAnyKey) this.onAnyKey();
      if (!e.repeat) this.pressed.add(e.code);
      this.down.add(e.code);
    });
    window.addEventListener('keyup', e => this.down.delete(e.code));
    window.addEventListener('blur', () => this.down.clear());
  }
  isDown(c) { return this.down.has(c); }
  hit(...codes) { return codes.some(c => this.pressed.has(c)); }
  endStep() { this.pressed.clear(); }
}

// Fighters read a controller; keyboard and AI expose the same interface.
class KeyboardController {
  constructor(input, map) { this.input = input; this.map = map; }
  held(a) { return this.input.isDown(this.map[a]); }
  pressed(a) { return this.input.hit(this.map[a]); }
  think() {}
  endStep() {}
}

/* =====================================================================
   AUDIO — all sounds synthesised with Web Audio
   ===================================================================== */
class Sound {
  constructor() { this.ac = null; this.muted = false; }
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = this.muted ? 0 : CONFIG.volume;
    this.master.connect(this.ac.destination);
    const len = this.ac.sampleRate;
    this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setValueAtTime(this.muted ? 0 : CONFIG.volume, this.ac.currentTime);
  }
  get live() { return this.ac && !this.muted && this.ac.state === 'running'; }
  envelope(param, t, peak, attack, dur) {
    param.setValueAtTime(0.0001, t);
    param.linearRampToValueAtTime(peak, t + attack);
    param.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  tone(type, f0, f1, dur, vol, delay = 0, attack = 0.005) {
    if (!this.live) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    this.envelope(g.gain, t, vol, attack, dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  noise(dur, vol, type, f0, f1, q = 1, delay = 0) {
    if (!this.live) return;
    const t = this.ac.currentTime + delay;
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.noiseBuf;
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    this.envelope(g.gain, t, vol, 0.01, dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  squeak(delay) {   // the high-pitched warble of a man in distress
    if (!this.live) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain(), lfo = this.ac.createOscillator(), lg = this.ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(1500, t);
    o.frequency.linearRampToValueAtTime(2900, t + 0.07);
    o.frequency.linearRampToValueAtTime(2100, t + 0.32);
    lfo.frequency.value = 32; lg.gain.value = 160;
    lfo.connect(lg); lg.connect(o.frequency);
    this.envelope(g.gain, t, 0.22, 0.01, 0.34);
    o.connect(g); g.connect(this.master);
    o.start(t); lfo.start(t); o.stop(t + 0.4); lfo.stop(t + 0.4);
  }
  whoosh()  { this.noise(0.17, 0.55, 'bandpass', 2600, 450, 1.4); }
  hit()     { this.tone('square', 330, 55, 0.13, 0.32); this.noise(0.07, 0.45, 'lowpass', 2400, 300); this.squeak(0.07); }
  block()   { this.noise(0.09, 0.55, 'lowpass', 1000, 180); this.tone('square', 170, 90, 0.08, 0.18); }
  jump()    { this.tone('square', 250, 520, 0.1, 0.1); }
  land()    { this.noise(0.05, 0.25, 'lowpass', 500, 120); }
  menu()    { this.tone('square', 880, 880, 0.05, 0.1); }
  tick()    { this.tone('square', 440, 440, 0.08, 0.12); }
  confirm() { this.tone('square', 660, 660, 0.06, 0.12); this.tone('square', 990, 990, 0.12, 0.12, 0.06); }
  puff()    { this.noise(0.22, 0.25, 'bandpass', 1100, 600, 0.8); this.noise(0.22, 0.2, 'bandpass', 1000, 500, 0.8, 0.28); }
  round()   { this.tone('triangle', 440, 440, 0.18, 0.3); this.tone('triangle', 554, 554, 0.18, 0.3, 0.18); this.tone('triangle', 659, 659, 0.35, 0.3, 0.36); }
  fight()   { for (const f of [196, 247, 294, 392]) this.tone('sawtooth', f, f * 0.97, 0.5, 0.07, 0, 0.01); this.noise(0.2, 0.3, 'highpass', 3000, 1500, 0.7); }
  vs()      { this.noise(0.4, 0.35, 'bandpass', 300, 2400, 0.8); this.tone('sawtooth', 110, 220, 0.4, 0.1); }
  ko()      { this.tone('sawtooth', 720, 45, 1.0, 0.22, 0.05); this.tone('square', 360, 30, 1.0, 0.12, 0.05); }
  gameOver(){ [392, 330, 262, 196].forEach((f, i) => this.tone('triangle', f, f, 0.35, 0.28, i * 0.3, 0.01)); }
  victory(delay = 0) {
    const mel = [[523, 0, 0.12], [659, 0.12, 0.12], [784, 0.24, 0.12], [1047, 0.36, 0.28], [784, 0.66, 0.12], [1047, 0.8, 0.55]];
    for (const [f, d, l] of mel) this.tone('square', f, f, l, 0.13, d + delay, 0.01);
    const bass = [[131, 0, 0.34], [196, 0.36, 0.28], [262, 0.66, 0.7]];
    for (const [f, d, l] of bass) this.tone('triangle', f, f, l, 0.28, d + delay, 0.01);
  }
}

const PARALLAX = { far: 0.2, mid: 0.5, ground: 1.0 };

  sky: CONFIG.screenW,

// --- shared drawing helpers for stage builders ---
function skyBands(x, cols, bandH) {
  const W = CONFIG.screenW, H = CONFIG.screenH;
  for (let i = 0; i < cols.length; i++) {
    const y0 = i * bandH, y1 = i === cols.length - 1 ? H : y0 + bandH;
    rect(x, cols[i], 0, y0, W, y1 - y0);
    if (i > 0) {   // dithered seam between bands
      x.fillStyle = cols[i - 1];
      for (let yy = y0; yy < y0 + 3; yy++) {
        const step = yy - y0 === 2 ? 4 : 2;
        for (let xx = (yy - y0) % 2; xx < W; xx += step) x.fillRect(xx, yy, 1, 1);
      }
    }
  }
}
function stars(x, rng, n, maxY) {
  for (let i = 0; i < n; i++) rect(x, rng() < 0.3 ? '#ffffff' : '#b9a6d9', Math.floor(rng() * CONFIG.screenW), Math.floor(rng() * maxY), 1, 1);
}
function speckle(x, rng, n, x0, y0, w, h, cols) {
  for (let i = 0; i < n; i++) rect(x, cols[i % cols.length], x0 + Math.floor(rng() * w), y0 + Math.floor(rng() * h), 1, 1);
}
function disc(x, color, cx, cy, r) {
  for (let dy = -r; dy <= r; dy++) { const half = Math.round(Math.sqrt(r * r - dy * dy)); rect(x, color, Math.round(cx) - half, Math.round(cy) + dy, half * 2 + 1, 1); }
}
function glow(x, color, cx, cy, radii) {
  x.fillStyle = color;
  for (const r of radii) { x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); }
}
function line(x, color, a, b, w = 1) { seg(x, a, b, w, w, color, 0); }

    rect(x, '#1c1626', lx, 98, 2, 60); rect(x, '#1c1626', lx - 4, 96, 10, 3); rect(x, '#ffe8a3', lx - 3, 99, 8, 2);

// --- fighter drawing: chunky pixel limbs built from squares along each bone ---
function seg(ctx, a, b, w1, w2, color, grow) {
  ctx.fillStyle = color;
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
  for (let i = 0; i <= n; i++) {
    const t = i / n, w = Math.round(w1 + (w2 - w1) * t) + grow * 2;
    ctx.fillRect(Math.round(a[0] + dx * t - w / 2), Math.round(a[1] + dy * t - w / 2), w, w);
  }
}

  if (shoes) { rect(ctx, pal.shoe, f[0] - 2, f[1] - 1, 9, 4); rect(ctx, '#000000', f[0] - 2, f[1] + 2, 9, 1); }

/* =====================================================================
   EFFECTS — popups, sparks, sweat
   ===================================================================== */
class Effects {
  constructor() { this.items = []; }
  clear() { this.items.length = 0; }
  popup(text, x, y, o = {}) {
    this.items.push({ kind: 'text', text, x, y, t: 0, life: o.life || 1.1, color: o.color || '#ffd43b', outline: o.outline || '#a51111', scale: o.scale || 2 });
  }
  spark(x, y, big) { this.items.push({ kind: 'spark', x, y, t: 0, life: big ? 0.28 : 0.18, big }); }
  sweat(x, y) { this.items.push({ kind: 'drop', x, y, vx: rand(-40, 40), vy: rand(-70, -30), t: 0, life: 0.5 }); }
  update(dt) {
    for (const e of this.items) {
      e.t += dt;
      if (e.kind === 'drop') { e.vy += 320 * dt; e.x += e.vx * dt; e.y += e.vy * dt; }
    }
    this.items = this.items.filter(e => e.t < e.life);
  }
  draw(ctx, cam) {
    const W = CONFIG.screenW;
    for (const e of this.items) {
      if (e.kind === 'text') {
        if (e.t > e.life - 0.3 && Math.floor(e.t * 20) % 2) continue;
        const k = Math.min(1, e.t / 0.2), y = Math.round(e.y - 16 * (1 - (1 - k) * (1 - k)) - e.t * 8);
        const scale = e.t < 0.06 ? e.scale + 1 : e.scale, w = textWidth(e.text, scale);
        drawText(ctx, e.text, clamp(e.x - cam, w / 2 + 2, W - w / 2 - 2), y, { scale, align: 'center', color: e.color, outline: e.outline });
      } else if (e.kind === 'spark') {
        drawSpark(ctx, e.x - cam, e.y, e.t / e.life, e.big);
      } else {
        rect(ctx, '#a5d8ff', Math.round(e.x - cam), Math.round(e.y), 1, 2);
      }
    }
  }
}

/* =====================================================================
   FIGHTER — state machine, physics, animation playback
   ===================================================================== */
class Fighter {
  constructor(ch, pal, x, facing, ctrl) {
    this.ch = ch; this.pal = pal; this.ctrl = ctrl; this.st = ch.stats; this.isCPU = false;
    this.guardMax = CONFIG.guard.maxHold * this.st.guard;
    this.x = x; this.px = x; this.y = CONFIG.groundY; this.vx = 0; this.vy = 0; this.pushV = 0;
    this.facing = facing; this.onGround = true;
    this.state = 'idle'; this.anim = 'idle'; this.animTime = 0; this.frameIndex = 0;
    this.score = 0; this.invuln = 0; this.timer = 0; this.guardUse = 0; this.kickBuffer = 0;
    this.kickHasHit = false; this.kickBlocked = false; this.whooshed = false;
    this.locked = true; this.meterFlash = 0;
  }
  get frame() { return ANIMS[this.anim].frames[this.frameIndex]; }
  get pose() { return this.frame.pose; }
  get neutral() { return this.state === 'idle' || this.state === 'walk' || this.state === 'crouch' || this.state === 'guard'; }

  enter(s) {
    if (this.state === s) return;
    this.state = s;
    const a = STATE_ANIM[s];
    if (this.anim !== a) { this.anim = a; this.animTime = 0; this.frameIndex = 0; }
  }
  // Returns true when a non-looping animation has finished.
  advanceAnim(dt) {
    const A = ANIMS[this.anim];
    this.animTime += dt;
    let f = A.frames[this.frameIndex];
    while (this.animTime >= f.d) {
      if (this.frameIndex < A.frames.length - 1) { this.animTime -= f.d; this.frameIndex++; }
      else if (A.loop) { this.animTime -= f.d; this.frameIndex = 0; }
      else { this.animTime = f.d; return true; }
      f = A.frames[this.frameIndex];
    }
    return false;
  }
  faceOpponent(opp) { if (Math.abs(opp.x - this.x) > 2) this.facing = opp.x > this.x ? 1 : -1; }

  update(dt, opp) {
    const K = CONFIG, c = this.ctrl;
    if (this.invuln > 0) this.invuln = Math.max(0, this.invuln - dt);
    if (this.meterFlash > 0) this.meterFlash -= dt;
    if (this.state === 'guard') this.guardUse += dt;
    else if (this.state !== 'fatigue') this.guardUse = Math.max(0, this.guardUse - K.guard.recoverRate * dt);
    if (this.kickBuffer > 0) this.kickBuffer -= dt;
    if (!this.locked && c.pressed('kick')) this.kickBuffer = K.kick.buffer;

    switch (this.state) {
      case 'idle': case 'walk': case 'crouch': case 'guard':
        this.updateNeutral(opp);
        this.advanceAnim(dt);
        break;
      case 'kick': {
        // Per-character kick speed: startup and recovery frames play faster or slower.
        const m = this.frameIndex === 0 ? this.st.startup : this.frameIndex === 2 ? this.st.recovery : 1;
        if (this.advanceAnim(dt / m)) {
          if (this.kickBlocked) { this.enter('stagger'); this.timer = K.kick.blockedPenalty; }
          else this.enter('idle');
        } else if (this.frameIndex >= 1 && !this.whooshed) { this.whooshed = true; sfx.whoosh(); }
        break;
      }
      case 'stagger':
        this.timer -= dt;
        if (this.timer <= 0) this.enter('idle');
        break;
      case 'jump':
        if (this.onGround) { this.vx = 0; this.enter('land'); this.timer = K.landingLag; sfx.land(); }
        break;
      case 'land':
        this.timer -= dt;
        if (this.timer <= 0) this.enter('idle');
        break;
      case 'hurt':
        this.timer -= dt; this.advanceAnim(dt);
        if (this.timer <= 0 && this.onGround) this.enter('idle');
        break;
      case 'fatigue':
        this.timer -= dt; this.advanceAnim(dt);
        if (Math.random() < dt * 6) game.fx.sweat(this.x + this.facing * 14, this.y - 58);
        if (this.timer <= 0) { this.guardUse = this.guardMax * K.guard.afterFatigue; this.enter('idle'); }
        break;
      case 'win': case 'lose':
        this.advanceAnim(dt);
        break;
    }

    // physics
    if (!this.onGround) this.vy += K.gravity * dt;
    this.x += (this.vx + this.pushV) * dt;
    this.y += this.vy * dt;
    if (this.y >= K.groundY) { this.y = K.groundY; this.vy = 0; this.onGround = true; } else this.onGround = false;
    if (this.pushV !== 0) {
      const d = K.pushFriction * dt;
      this.pushV = Math.abs(this.pushV) <= d ? 0 : this.pushV - Math.sign(this.pushV) * d;
    }
  }

  updateNeutral(opp) {
    const K = CONFIG, c = this.ctrl, speed = this.st.speed;
    if (this.locked) { this.vx = 0; this.enter('idle'); return; }
    this.faceOpponent(opp);
    const dir = (c.held('right') ? 1 : 0) - (c.held('left') ? 1 : 0);
    if (this.kickBuffer > 0) { this.startKick(); return; }
    if (c.held('up') || c.pressed('up')) { this.startJump(dir); return; }
    if (c.held('guard')) {
      this.enter('guard');
      this.vx = dir * K.walkSpeed * speed * K.guardWalkMult;
      if (this.guardUse >= this.guardMax) this.becomeFatigued();
      return;
    }
    if (c.held('down')) { this.enter('crouch'); this.vx = 0; return; }
    if (dir) { this.enter('walk'); this.vx = dir * speed * (dir === this.facing ? K.walkSpeed : K.backWalkSpeed); }
    else { this.enter('idle'); this.vx = 0; }
  }
  startKick() {
    this.enter('kick');
    this.kickBuffer = 0; this.kickHasHit = false; this.kickBlocked = false; this.whooshed = false; this.vx = 0;
  }
  startJump(dir) {
    this.enter('jump');
    this.vy = -CONFIG.jumpVelocity * this.st.jump; this.vx = dir * CONFIG.jumpForwardSpeed * this.st.speed; this.onGround = false;
    sfx.jump();
  }
  becomeFatigued() {
    this.enter('fatigue');
    this.timer = CONFIG.guard.fatigueTime; this.vx = 0;
    sfx.puff();
    game.fx.popup('KNACKERED!', this.x, this.y - 88, { color: '#ff8787', outline: '#5c0f0f', scale: 1, life: 0.9 });
  }
  takeHit(att) {
    const away = Math.sign(this.x - att.x) || -this.facing;
    this.enter('hurt');
    this.timer = CONFIG.hurtTime; this.vx = 0; this.pushV = away * CONFIG.knockback / this.st.weight;
    this.invuln = CONFIG.hurtTime + CONFIG.invulnAfterHurt;
    this.kickBuffer = 0; this.meterFlash = 0.5;
  }
  blockHit(att) { this.pushV = (Math.sign(this.x - att.x) || -this.facing) * CONFIG.blockPush / this.st.weight; }
}

/* =====================================================================
   AI — a small state machine that drives a virtual controller
   ===================================================================== */
// Blend the level tables: skill 0..3 maps across easy, normal, hard, brutal.
function aiParams(skill) {
  const names = ['easy', 'normal', 'hard', 'brutal'], s = clamp(skill, 0, 3);
  const i = Math.min(2, Math.floor(s)), f = s - i, a = CONFIG.ai.levels[names[i]], b = CONFIG.ai.levels[names[i + 1]], o = {};
  for (const k in a) o[k] = a[k] + (b[k] - a[k]) * f;
  return o;
}
class AIController {
  constructor(skill) {
    this.p = aiParams(skill);
    this.h = new Set(); this.t = new Set();     // held / tapped this step
    this.mode = 'approach'; this.modeTimer = 0; this.decideTimer = 0.4;
    this.reacted = false; this.rangeErr = 0; this.spacingJitter = 0;
  }
  held(a) { return this.h.has(a); }
  pressed(a) { return this.t.has(a); }
  endStep() { this.t.clear(); }
  setMode(m, time = 0) { this.mode = m; this.modeTimer = time; }

  think(dt, me, opp) {
    const p = this.p, K = CONFIG;
    this.h.clear();
    if (me.locked) return;
    const dist = Math.abs(opp.x - me.x);
    const toward = opp.x > me.x ? 'right' : 'left', away = toward === 'right' ? 'left' : 'right';
    const range = K.ai.kickRange + this.rangeErr;
    this.modeTimer -= dt; this.decideTimer -= dt;

    // Defence: when the opponent starts a kick, maybe "read" it and guard or hop over.
    if (opp.state === 'kick' && opp.frameIndex === 0 && !this.reacted) {
      this.reacted = true;
      if (dist < 70 && me.neutral && Math.random() < p.defend) {
        if (Math.random() < p.jumpOver) this.setMode('jump', 0.05);
        else if (me.guardUse < me.guardMax * p.guardLimit) this.setMode('guard', rand(0.3, 0.5));
        else this.setMode('retreat', 0.3);
      }
    }
    if (opp.state !== 'kick') this.reacted = false;

    const committed = (this.mode === 'guard' || this.mode === 'jump' || this.mode === 'retreat') && this.modeTimer > 0;
    if (!committed && this.decideTimer <= 0) {
      this.decideTimer = p.reaction * rand(0.6, 1.4);
      this.decide(me, opp, dist, range);
    }

    switch (this.mode) {
      case 'approach':
        this.h.add(toward);
        if (dist <= range) this.setMode(Math.random() < p.aggression ? 'attack' : 'space');
        break;
      case 'attack':
        if (dist <= range) {
          this.t.add('kick');
          this.setMode('space');
          this.decideTimer = p.reaction;
          this.rangeErr = rand(-1, 1) * p.rangeError;
        } else this.h.add(toward);
        break;
      case 'retreat': this.h.add(away); break;
      case 'guard':
        this.h.add('guard');
        if (this.modeTimer <= 0 || me.guardUse > me.guardMax * p.guardLimit) this.setMode('space');
        break;
      case 'jump':
        this.h.add('up');
        if (this.modeTimer <= 0) this.setMode('space');
        break;
      case 'crouch': this.h.add('down'); break;
      case 'space': {
        const want = p.spacing + this.spacingJitter;
        if (dist < want - 6) this.h.add(away); else if (dist > want + 6) this.h.add(toward);
        break;
      }
    }
  }
  decide(me, opp, dist, range) {
    const p = this.p, r = Math.random();
    this.spacingJitter = rand(-10, 10);
    if (opp.state === 'hurt' || opp.state === 'lose' || opp.invuln > 0.2) { this.setMode('space'); return; }
    const oppOpen = (opp.state === 'kick' && opp.frameIndex === 2) || opp.state === 'stagger' || opp.state === 'fatigue' || opp.state === 'land';
    if (oppOpen && dist < range + 30 && r < p.punish) { this.setMode('attack'); return; }
    if (dist <= range) {
      if (r < p.aggression) this.setMode('attack');
      else if (r < p.aggression + 0.2) this.setMode('retreat', rand(0.15, 0.35));
      else if (r < p.aggression + 0.3) this.setMode('crouch');
      else this.setMode('space');
      return;
    }
    if (dist > range + 35) { this.setMode(r < 0.35 + p.aggression * 0.6 ? 'approach' : 'space'); return; }
    this.setMode(r < p.aggression * 0.8 ? 'attack' : 'space');
  }
}

/* =====================================================================
   GAME — scenes: title, select, stage select, vs, fight, victory,
          continue, ending. Modes: arcade, vscpu, 2p.
   ===================================================================== */
const MODES = [
  { id: 'arcade', label: 'ARCADE' },
  { id: 'vscpu', label: '1 PLAYER VS CPU' },
  { id: '2p', label: '2 PLAYERS' },
].filter(m => !(TOUCH && m.id === '2p'));   // two players can't share one phone screen

class Game {
  constructor() {
    this.scene = 'title'; this.time = 0;
    this.menu = 0; this.diff = 1; this.mode = 'arcade';
    this.debug = false; this.paused = false;
    this.fx = new Effects();
    this.shake = 0; this.hitstop = 0; this.cheer = 0;
    this.camX = MAX_CAM / 2;
    this.stage = STAGES[0];
    this.toast = null; this.fps = 60; this.lastLine = '';
  }
  showToast(text) { this.toast = { text, t: 1.2 }; }
  get aiSkill() { return this.diff + (this.mode === 'arcade' ? this.ladderIdx * CONFIG.ai.arcadeRamp : 0); }

  update(dt) {
    this.time += dt;
    if (input.hit('KeyM')) { sfx.toggleMute(); this.showToast(sfx.muted ? 'SOUND OFF' : 'SOUND ON'); }
    if (input.hit('KeyH')) { this.debug = !this.debug; this.showToast(this.debug ? 'HITBOXES ON' : 'HITBOXES OFF'); }
    if (this.toast && (this.toast.t -= dt) <= 0) this.toast = null;
    if (input.hit('Escape') && this.scene !== 'title') { this.scene = 'title'; this.paused = false; sfx.menu(); return; }
    switch (this.scene) {
      case 'title': this.updateTitle(); break;
      case 'select': this.updateSelect(dt); break;
      case 'stagesel': this.updateStageSelect(); break;
      case 'vs': this.updateVs(dt); break;
      case 'fight': this.updateFight(dt); break;
      case 'victory': this.updateVictory(dt); break;
      case 'continue': this.updateContinue(dt); break;
      case 'ending': this.updateEnding(dt); break;
    }
  }

  // ---- title ----
  updateTitle() {
    const rows = MODES.length + 1;
    if (input.hit('KeyW', 'ArrowUp')) { this.menu = (this.menu + rows - 1) % rows; sfx.menu(); }
    if (input.hit('KeyS', 'ArrowDown')) { this.menu = (this.menu + 1) % rows; sfx.menu(); }
    const l = input.hit('KeyA', 'ArrowLeft'), r = input.hit('KeyD', 'ArrowRight');
    if (this.menu === MODES.length && (l || r)) { this.diff = (this.diff + (r ? 1 : 2)) % 3; sfx.menu(); }
    if (input.hit(...OK_KEYS)) {
      sfx.confirm();
      if (this.menu === MODES.length) this.diff = (this.diff + 1) % 3;
      else { this.mode = MODES[this.menu].id; this.toSelect(); }
    }
  }

  // ---- character select (3x2 grid) ----
  toSelect() {
    this.scene = 'select'; this.selTimer = 0;
    this.sel = [{ idx: 0, done: false }, { idx: 1, done: false }];
  }
  updateSelect(dt) {
    const [a, b] = this.sel;
    const P1K = ['KeyA', 'KeyD', 'KeyW', 'KeyS'], P2K = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
    const nav = (s, keys) => {
      const [L, R, U, D] = keys;
      const dx = (input.hit(R) ? 1 : 0) - (input.hit(L) ? 1 : 0), dy = (input.hit(D) ? 1 : 0) - (input.hit(U) ? 1 : 0);
      if (!dx && !dy) return;
      s.idx = mod(Math.floor(s.idx / 3) + dy, 2) * 3 + mod(s.idx % 3 + dx, 3);
      sfx.menu();
    };
    const soloOk = () => input.hit(...OK_KEYS);
    if (this.mode === '2p') {
      if (!a.done) { nav(a, P1K); if (input.hit('KeyF', 'Enter', 'Space')) { a.done = true; sfx.confirm(); } }
      if (!b.done) { nav(b, P2K); if (input.hit('KeyK')) { b.done = true; sfx.confirm(); } }
    } else if (!a.done) {
      nav(a, P1K); nav(a, P2K);
      if (soloOk()) { a.done = true; sfx.confirm(); if (this.mode === 'vscpu') b.idx = (a.idx + 1) % CHARACTERS.length; }
    } else if (this.mode === 'vscpu' && !b.done) {
      nav(b, P1K); nav(b, P2K);
      if (soloOk()) { b.done = true; sfx.confirm(); }
    }
    const ready = this.mode === 'arcade' ? a.done : a.done && b.done;
    if (ready && (this.selTimer += dt) > 0.6) {
      this.p1Char = a.idx;
      if (this.mode === 'arcade') {
        this.ladder = shuffle(CHARACTERS.map((_, i) => i).filter(i => i !== a.idx));
        this.ladderIdx = 0;
        this.toVs();
      } else { this.p2Char = b.idx; this.toStageSelect(); }
    }
  }

  // ---- stage select (vs modes) ----
  toStageSelect() {
    this.scene = 'stagesel';
    this.stageCursor = STAGES.indexOf(stageById(CHARACTERS[this.p2Char].home));
  }
  updateStageSelect() {
    const n = STAGES.length + 1;   // last row is RANDOM
    if (input.hit('KeyW', 'ArrowUp')) { this.stageCursor = (this.stageCursor + n - 1) % n; sfx.menu(); }
    if (input.hit('KeyS', 'ArrowDown')) { this.stageCursor = (this.stageCursor + 1) % n; sfx.menu(); }
    if (input.hit(...OK_KEYS)) {
      sfx.confirm();
      this.stage = this.stageCursor === STAGES.length ? pick(STAGES) : STAGES[this.stageCursor];
      this.toVs();
    }
  }

  // ---- VS splash ----
  toVs() {
    if (this.mode === 'arcade') {
      this.p2Char = this.ladder[this.ladderIdx];
      this.stage = stageById(CHARACTERS[this.p2Char].home);
    }
    this.scene = 'vs'; this.vsTime = 0;
    sfx.vs();
  }
  updateVs(dt) {
    this.vsTime += dt;
    if (this.vsTime > 2.8 || (this.vsTime > 0.5 && input.hit(...OK_KEYS))) this.startFight();
  }

  // ---- fight ----
  startFight() {
    const c1 = CHARACTERS[this.p1Char], c2 = CHARACTERS[this.p2Char], mid = CONFIG.stageW / 2;
    const p1 = new KeyboardController(input, KEYS.p1);
    const p2 = this.mode === '2p' ? new KeyboardController(input, KEYS.p2) : new AIController(this.aiSkill);
    this.f1 = new Fighter(c1, c1.pals[0], mid - 60, 1, p1);
    this.f2 = new Fighter(c2, c2.pals[this.p1Char === this.p2Char ? 1 : 0], mid + 60, -1, p2);   // mirror match gets alt colours
    this.f2.isCPU = this.mode !== '2p';
    this.scene = 'fight'; this.phase = 'intro'; this.phaseTime = 0; this.fightCalled = false;
    this.fx.clear(); this.hitstop = 0; this.shake = 0; this.cheer = 0; this.paused = false;
    this.winner = null; this.loser = null;
    this.camX = mid - CONFIG.screenW / 2;
    sfx.round();
  }
  updateFight(dt) {
    if (input.hit('KeyP')) { this.paused = !this.paused; sfx.menu(); }
    if (this.paused) return;
    const { f1, f2 } = this;
    this.phaseTime += dt;
    this.fx.update(dt);
    this.shake = Math.max(0, this.shake - dt * 24);
    this.cheer = Math.max(0, this.cheer - dt);

    if (this.phase === 'intro') {
      f1.locked = f2.locked = true;
      if (this.phaseTime >= 1.1 && !this.fightCalled) { this.fightCalled = true; sfx.fight(); }
      if (this.phaseTime >= 1.9) { this.phase = 'fight'; f1.locked = f2.locked = false; }
    }
    if (this.hitstop > 0) { this.hitstop -= dt; return; }

    f1.px = f1.x; f2.px = f2.x;
    f1.ctrl.think(dt, f1, f2); f2.ctrl.think(dt, f2, f1);
    f1.update(dt, f2); f2.update(dt, f1);
    f1.ctrl.endStep(); f2.ctrl.endStep();
    this.resolvePush();

    if (this.phase === 'fight') {
      // Resolve both before applying either, so simultaneous kicks trade.
      const r1 = this.checkHit(f1, f2), r2 = this.checkHit(f2, f1);
      if (r1) this.applyHit(f1, f2, r1);
      if (r2 && this.phase === 'fight') this.applyHit(f2, f1, r2);
    } else if (this.phase === 'ko') {
      if (this.phaseTime > 1.3 && this.loser.state !== 'lose') {
        this.loser.enter('lose'); this.loser.invuln = 0; this.loser.vx = 0;
        this.winner.enter('win'); this.winner.vx = 0;
      }
      if (this.phaseTime > 3.6) this.toVictory();
    }
    this.updateCamera(dt);
  }
  checkHit(att, def) {
    if (att.state !== 'kick' || att.kickHasHit) return null;
    const hb = att.frame.hit;
    if (!hb) return null;
    if (def.invuln > 0 || def.state === 'hurt' || def.state === 'lose') return null;
    const H = worldBox(att, hb);
    for (const b of def.frame.hurt) {
      if (b.type !== 'groin') continue;
      const G = worldBox(def, b);
      if (overlaps(H, G)) {
        const blocking = def.state === 'guard' && def.facing === Math.sign(att.x - def.x);
        return {
          type: blocking ? 'block' : 'hit',
          x: (Math.max(H.x, G.x) + Math.min(H.x + H.w, G.x + G.w)) / 2,
          y: (Math.max(H.y, G.y) + Math.min(H.y + H.h, G.y + G.h)) / 2,
        };
      }
    }
    return null;
  }
  applyHit(att, def, r) {
    att.kickHasHit = true;
    if (r.type === 'block') {
      att.kickBlocked = true;
      def.blockHit(att);
      sfx.block();
      this.fx.spark(r.x, r.y, false);
      this.fx.popup(pick(BLOCK_LINES), def.x, def.y - 90, { color: '#74c0fc', outline: '#0b3954', scale: 1, life: 0.7 });
      this.hitstop = 0.05; this.shake = 1.5;
      return;
    }
    att.score++;
    def.takeHit(att);
    sfx.hit();
    if (TOUCH && def === this.f1 && navigator.vibrate) try { navigator.vibrate(70); } catch (e) {}   // feel it
    this.fx.spark(r.x, r.y, true);
    let line;
    do line = pick(HIT_LINES); while (line === this.lastLine);
    this.lastLine = line;
    this.fx.popup(line, def.x, def.y - 92, { scale: 2 });
    this.hitstop = CONFIG.hitstop; this.shake = 4; this.cheer = 1.4;
    if (att.score >= CONFIG.winScore) {
      this.phase = 'ko'; this.phaseTime = 0; this.winner = att; this.loser = def;
      att.locked = def.locked = true;
      this.hitstop = CONFIG.koHitstop; this.shake = 7;
      sfx.ko();
    }
  }
  resolvePush() {
    const a = this.f1, b = this.f2, K = CONFIG;
    const min = K.pushHalfWidth * 2, lo = 12, hi = K.stageW - 12, maxD = K.screenW - 48;
    const s = Math.sign(b.x - a.x) || a.facing;
    let d = Math.abs(b.x - a.x);
    if (d < min) { const ov = (min - d) / 2; a.x -= s * ov; b.x += s * ov; }
    a.x = clamp(a.x, lo, hi); b.x = clamp(b.x, lo, hi);
    if (Math.abs(b.x - a.x) < min) { if (a.x <= lo || a.x >= hi) b.x = a.x + s * min; else a.x = b.x - s * min; }
    d = Math.abs(b.x - a.x);
    if (d > maxD) {   // both must stay on screen: pull back whoever walked away
      const ma = Math.abs(a.x - a.px), mb = Math.abs(b.x - b.px), tot = ma + mb || 1, ex = d - maxD;
      a.x += s * ex * (ma / tot); b.x -= s * ex * (mb / tot);
    }
  }
  updateCamera(dt) {
    const target = clamp((this.f1.x + this.f2.x) / 2 - CONFIG.screenW / 2, 0, MAX_CAM);
    this.camX += (target - this.camX) * Math.min(1, dt * 10);
  }

  // ---- after the fight ----
  get playerWon() { return this.winner === this.f1; }
  toVictory() { this.scene = 'victory'; this.vicTime = 0; sfx.victory(); }
  updateVictory(dt) {
    this.vicTime += dt;
    if (this.vicTime < 1 || !input.hit(...OK_KEYS)) return;
    sfx.confirm();
    if (this.mode !== 'arcade') { this.startFight(); return; }
    if (!this.playerWon) { this.scene = 'continue'; this.contTime = CONFIG.continueTime; this.lastTick = CONFIG.continueTime; this.gameOver = 0; return; }
    this.ladderIdx++;
    if (this.ladderIdx >= this.ladder.length) { this.scene = 'ending'; this.endTime = 0; sfx.victory(); sfx.victory(1.5); }
    else this.toVs();
  }
  updateContinue(dt) {
    if (this.gameOver) {
      this.gameOver += dt;
      if (this.gameOver > 3 || (this.gameOver > 1 && input.hit(...OK_KEYS))) this.scene = 'title';
      return;
    }
    this.contTime -= dt;
    if (Math.ceil(this.contTime) < this.lastTick) { this.lastTick = Math.ceil(this.contTime); sfx.tick(); }
    if (input.hit(...OK_KEYS)) { sfx.confirm(); this.toVs(); return; }
    if (this.contTime <= 0) { this.gameOver = 0.001; sfx.gameOver(); }
  }
  updateEnding(dt) {
    this.endTime += dt;
    if (this.endTime > 2 && input.hit(...OK_KEYS)) { sfx.confirm(); this.scene = 'title'; }
  }

  /* ---------------- rendering ---------------- */
  render(ctx) {
    const W = CONFIG.screenW, H = CONFIG.screenH;
    rect(ctx, '#000', 0, 0, W, H);
    switch (this.scene) {
      case 'title': this.renderTitle(ctx); break;
      case 'select': this.renderSelect(ctx); break;
      case 'stagesel': this.renderStageSelect(ctx); break;
      case 'vs': this.renderVs(ctx); break;
      case 'fight': this.renderFight(ctx); break;
      case 'victory': this.renderVictory(ctx); break;
      case 'continue': this.renderContinue(ctx); break;
      case 'ending': this.renderEnding(ctx); break;
    }
    if (this.toast) drawText(ctx, this.toast.text, W - 4, H - 12, { align: 'right', color: '#ffffff' });
  }
  renderBackdrop(ctx, stage, dim) {
    drawStageBack(ctx, stage, MAX_CAM / 2, this.time, 0);
    rect(ctx, `rgba(8,4,20,${dim})`, 0, 0, CONFIG.screenW, CONFIG.screenH);
  }
  renderTitle(ctx) {
    const W = CONFIG.screenW, t = this.time, gy = CONFIG.groundY;
    // The backdrop tours every stage, with its home fighter on the left.
    const tour = Math.floor(t / 5) % STAGES.length, stage = STAGES[tour];
    this.renderBackdrop(ctx, stage, 0.55);
    const left = CHARACTERS.findIndex(c => c.home === stage.id), right = (left + 3) % CHARACTERS.length;
    const idle = Math.floor(t * 3) % 2 ? 'idle1' : 'idle0';
    drawShadow(ctx, 32, gy); drawShadow(ctx, 352, gy);
    drawFighter(ctx, CHARACTERS[left], CHARACTERS[left].pals[0], idle, 32, gy, 1, 1, t);
    drawFighter(ctx, CHARACTERS[right], CHARACTERS[right].pals[0], idle, 352, gy, -1, 1, t);
    drawText(ctx, 'NUTCRACKER', W / 2, 10, { scale: 4, align: 'center', color: '#ffd43b', outline: '#8a1c1c' });
    drawText(ctx, "'87", W / 2 + 122, 46, { scale: 2, align: 'right', color: '#ff6b6b', outline: '#2b0000' });
    drawText(ctx, 'ONE MOVE. SIX FIGHTERS. NO MERCY.', W / 2, 66, { align: 'center', color: '#e9e3d0' });
    const rows = [...MODES.map(m => m.label), `CPU LEVEL: < ${DIFFICULTIES[this.diff].toUpperCase()} >`];
    rows.forEach((label, i) => {
      const y = 80 + i * 17, sel = i === this.menu;
      drawText(ctx, label, W / 2, y, { scale: 2, align: 'center', color: sel ? '#ffd43b' : '#adb5bd' });
      if (sel && Math.floor(t * 4) % 2) drawText(ctx, '>', W / 2 - textWidth(label, 2) / 2 - 14, y, { scale: 2, color: '#ff6b6b' });
    });
    rect(ctx, 'rgba(0,0,0,0.6)', 46, 152, 292, 40);
    const help = TOUCH
      ? [['LEFT THUMB: D-PAD TO MOVE, JUMP, CROUCH', '#ff8787'], ['RIGHT THUMB: KICK, OR HOLD GUARD', '#74c0fc'], ['TOP RIGHT: QUIT, SOUND, PAUSE', '#e9e3d0']]
      : [['P1  A/D MOVE  W JUMP  S CROUCH  F KICK  G GUARD', '#ff8787'], ['P2  ARROWS MOVE/JUMP/CROUCH  K KICK  L GUARD', '#74c0fc'], ['M MUTE   H HITBOXES   P PAUSE   ESC TITLE', '#e9e3d0']];
    help.forEach(([line, col], i) => drawText(ctx, line, W / 2, 155 + i * 12, { align: 'center', color: col }));
    if (Math.floor(t * 2) % 2) drawText(ctx, TOUCH ? 'D-PAD UP/DOWN, KICK TO CHOOSE' : 'ENTER, F OR K TO CHOOSE', W / 2, 198, { align: 'center', color: '#ffffff' });
  }
  renderSelect(ctx) {
    const W = CONFIG.screenW, t = this.time, [a, b] = this.sel;
    this.renderBackdrop(ctx, stageById(CHARACTERS[a.idx].home), 0.65);
    drawText(ctx, 'SELECT YOUR FIGHTER', W / 2, 4, { scale: 2, align: 'center', color: '#ffd43b', outline: '#8a1c1c' });
    const idle = Math.floor(t * 3) % 2 ? 'idle1' : 'idle0';
    // grid of busts
    const gx = W / 2 - 60, gy = 26;
    CHARACTERS.forEach((ch, i) => {
      const x = gx + (i % 3) * 40, y = gy + Math.floor(i / 3) * 40;
      rect(ctx, '#e9e3d0', x, y, 38, 38); rect(ctx, '#1a1030', x + 1, y + 1, 36, 36);
      drawBust(ctx, ch, ch.pals[0], x + 1, y + 1, 36, 36, 2, 1, t);
    });
    const showB = this.mode === '2p' || (this.mode === 'vscpu' && a.done);
    const gridCursor = (s, col, k) => {
      if (!s.done && Math.floor(t * 5) % 2) return;

/* =====================================================================
   MAIN LOOP — fixed 60Hz simulation, rendered every animation frame
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
const note = document.getElementById('note');
if (TOUCH) document.body.classList.add('touch');
function fit() {
  const availW = TOUCH ? innerWidth : document.body.clientWidth - 32;
  const availH = TOUCH ? innerHeight : document.body.clientHeight - 24 - note.offsetHeight - 10;
  const s = Math.min(availW / CONFIG.screenW, availH / CONFIG.screenH);
  // Integer scaling keeps pixels square on a monitor; on a phone, filling the screen matters more.
  const k = TOUCH || s < 1 ? s : Math.floor(s);
  canvas.style.width = CONFIG.screenW * k + 'px';
  canvas.style.height = CONFIG.screenH * k + 'px';
}
window.addEventListener('resize', fit);
fit();

/* =====================================================================
   TOUCH — thumb controls that press P1's keys, so menus and fights
   work unchanged. One overlay tracks every finger by pointer id.
   ===================================================================== */
class TouchPad {
  constructor(input) {
    this.input = input;
    this.el = document.getElementById('pad');
    this.parts = {};
    for (const id of ['dpad', 'knob', 'kick', 'guard', 'btnBack', 'btnMute', 'btnPause']) this.parts[id] = document.getElementById(id);
    this.pointers = new Map();   // pointerId -> { x, y, zone }
    this.held = new Set();
    for (const type of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel']) this.el.addEventListener(type, e => this.onPointer(e), { passive: false });
    this.el.addEventListener('contextmenu', e => e.preventDefault());
  }
  zoneAt(x, y) {
    for (const [id, code] of [['btnBack', 'Escape'], ['btnMute', 'KeyM'], ['btnPause', 'KeyP']]) {
      const el = this.parts[id];
      if (getComputedStyle(el).display === 'none') continue;
      const r = el.getBoundingClientRect();
      if (x > r.left - 8 && x < r.right + 8 && y > r.top - 6 && y < r.bottom + 6) return code;
    }
    if (x < innerWidth * 0.45) return 'dpad';
    // Anywhere on the right goes to whichever button is nearer, so a thumb can't miss.
    const centre = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
    const [kx, ky] = centre(this.parts.kick), [gx, gy] = centre(this.parts.guard);
    return Math.hypot(x - kx, y - ky) <= Math.hypot(x - gx, y - gy) * 1.15 ? 'kick' : 'guard';
  }
  onPointer(e) {
    e.preventDefault();
    sfx.init();
    if (e.type === 'pointerdown') {
      try { this.el.setPointerCapture(e.pointerId); } catch (err) {}
      const zone = this.zoneAt(e.clientX, e.clientY);
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, zone });
      if (!['dpad', 'kick', 'guard'].includes(zone)) this.input.pressed.add(zone);   // one-shot buttons send their key code
      goFullscreen();
    } else if (e.type === 'pointermove') {
      const p = this.pointers.get(e.pointerId);
      if (!p) return;
      p.x = e.clientX; p.y = e.clientY;
      if (p.zone === 'kick' || p.zone === 'guard') {   // slide between kick and guard
        const z = this.zoneAt(p.x, p.y);
        if (z === 'kick' || z === 'guard') p.zone = z;
      }
    } else this.pointers.delete(e.pointerId);
    this.sync();
  }
  // Turn finger positions into held keys; newly held keys also count as presses.
  sync() {
    const K = KEYS.p1, want = new Set();
    let kx = 0, ky = 0;
    for (const p of this.pointers.values()) {
      if (p.zone === 'kick') want.add(K.kick);
      else if (p.zone === 'guard') want.add(K.guard);
      else if (p.zone === 'dpad') {
        const r = this.parts.dpad.getBoundingClientRect(), R = r.width / 2;
        const dx = (p.x - r.left - R) / R, dy = (p.y - r.top - R) / R, m = Math.hypot(dx, dy);
        if (m > 0.28) {   // dead zone; up and down need a firmer push than left and right
          const ux = dx / m, uy = dy / m;
          if (ux > 0.4) want.add(K.right);
          if (ux < -0.4) want.add(K.left);
          if (uy < -0.6) want.add(K.up);
          if (uy > 0.6) want.add(K.down);
        }
        const k = Math.min(1, m) / (m || 1);
        kx = dx * k * 40; ky = dy * k * 40;
      }
    }
    for (const c of want) if (!this.held.has(c)) { this.input.pressed.add(c); this.input.down.add(c); }
    for (const c of this.held) if (!want.has(c)) this.input.down.delete(c);
    this.held = want;
    this.parts.knob.style.transform = `translate(${Math.round(kx)}px, ${Math.round(ky)}px)`;
    this.parts.dpad.classList.toggle('on', [K.left, K.right, K.up, K.down].some(c => want.has(c)));
    this.parts.kick.classList.toggle('on', want.has(K.kick));
    this.parts.guard.classList.toggle('on', want.has(K.guard));
  }
}
// In a browser tab, go full-screen landscape on the first tap. An installed app already is.
function goFullscreen() {
  if (document.fullscreenElement || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) return;
  const el = document.documentElement;
  if (!el.requestFullscreen) return;
  el.requestFullscreen({ navigationUI: 'hide' }).then(() => {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  }).catch(() => {});
}

canvas.addEventListener('pointerdown', () => { canvas.focus(); sfx.init(); });   // keys only arrive once the page has focus
canvas.focus();
const pad = TOUCH ? new TouchPad(input) : null;
buildStages();
const game = new Game();

// Pause if the phone locks or the player switches app mid-fight.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.scene === 'fight' && game.phase === 'fight') game.paused = true;
});
// Offline support when served as an installable app (skipped in the artifact viewer, which has no manifest).
if ('serviceWorker' in navigator && document.querySelector('link[rel="manifest"]') && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const STEP = 1 / 60;
let acc = 0, last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.25) dt = 0.25;                  // tab was asleep; don't fast-forward
  if (dt > 0) game.fps += (1 / dt - game.fps) * 0.05;
  acc += dt;
  let steps = 0;
  while (acc >= STEP && steps < 6) { game.update(STEP); input.endStep(); acc -= STEP; steps++; }
  if (steps >= 6) acc = 0;
  game.render(ctx);
  if (pad && pad.el.dataset.scene !== game.scene) pad.el.dataset.scene = game.scene;   // shows/hides the top buttons
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
